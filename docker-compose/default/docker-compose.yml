version: "3.8"
services:
  rabbit:
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    container_name: rabbit
    ports:
      - "15672:15672"
      - "5672:5672"
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common.yml
      service: ms-deploy-network
  
  configserver:
    image: suytry123/configserver:v2
    container_name: configserver-ms
    healthcheck:
      test: "curl --fail --silent http://localhost:8071/actuator/health/readiness | grep 'UP' || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "8071:8071"
    depends_on:
      rabbit:
        condition: service_healthy
    extends:
      file: common.yml
      service: ms-base

  eurekaserver:
    image: suytry123/eurekaserver:v2
    container_name: eurekaserver-ms
    healthcheck:
      test: "curl --fail --silent http://localhost:9000/actuator/health/readiness | grep 'UP' || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "9000:9000"
    extends:
      file: common.yml
      service: ms-base-configserver

  mongo:
    image: mongo:6.0.7
    container_name: mongo
    ports:
      - "7777:27017"
    volumes:
      - './data:/data/db'
    extends:
      file: common.yml
      service: ms-deploy-network

  account:
    image: suytry123/account:v2
    container_name: account-ms
    healthcheck:
      test: "curl --fail --silent http://localhost:8080/actuator/health/readiness | grep 'UP' || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "8080:8080"
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    extends:
      file: common.yml
      service:  ms-base-eurekaserver

  card:
    image: suytry123/card:v2
    container_name: card-ms
    healthcheck:
      test: "curl --fail --silent http://localhost:8070/actuator/health/readiness | grep 'UP' || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "8070:8070"
    environment:
      MONGODB_HOST_NAME: mongo
    extends:
      file: common.yml
      service:  ms-base-eurekaserver

  loan:
    image: suytry123/loan:v2
    container_name: loan-ms
    healthcheck:
      test: "curl --fail --silent http://localhost:8090/actuator/health/readiness | grep 'UP' || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "8090:8090"
    environment:
      MONGODB_HOST_NAME: mongo
    extends:
      file: common.yml
      service:  ms-base-eurekaserver

  gatewayserver:
    image: suytry123/gatewayserver:v2
    container_name: gatewayserver-ms
    ports:
      - "8072:8072"
    depends_on:
      account:
        condition: service_healthy
      card:
        condition: service_healthy
      loan:
        condition: service_healthy
    extends:
      file: common.yml
      service:  ms-base-eurekaserver
networks:
  suytrybanknet: