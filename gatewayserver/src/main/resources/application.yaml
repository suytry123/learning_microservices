spring:
  application:
    name: gatewayserver
  config:
    import: "optional:configserver:http://localhost:8071/"
#  cloud:
#    gateway:
#      discovery:
#        locator:
#          enabled: true
#          lowerCaseServiceId: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}

  endpoint:
    gateway:
      enabled: true

info:
  app:
    name: Gateway Server Microservice
    description: Piseth Bank Gateway Server Application
    version: 1.0.0

logging:
  level:
    com:
      school:
        gatewayserver: DEBUG
  pattern:    
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"