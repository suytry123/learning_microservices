spring:
  data:
    mongodb:
      host: ${MONGODB_HOST_NAME:localhost}
#      host: mongodb
      port: 27017
      database: card_service_db
      auto-index-creation: true     # Automatically creates indexes defined via @Indexed
  application:
    name: card
  profiles:
    active: prod
  config:
    import: optional:configserver:http://localhost:8071

#===== RabbitMQ =======
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8070
management:
  endpoints:
    web:
      exposure:
        include: info, health, shutdown, refresh, busrefresh

  endpoint:
    shutdown:
      enabled: true
    
    health:
      probes:
        enabled: true

  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

  info:
    env:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}

eureka:
  instance:
    prefer-ip-address: true

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:9000/eureka

logging:
  level:
    com:
      school:
        card: DEBUG

#configuration info endpoint
info:
  app:
    name: Card Microservice
    description: Suytry Bank Card App
    version: 1.0.0  # get from pom