spring:
  application:
    name: configserver

  profiles:
    #active: native
    active: git

  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config

        git:
          uri: https://github.com/suytry123/bank-config-server
          #uri: https://github.com/suytry123/bank-config-server-private
          #username: suytry123
          #password: ${GIT_TOKEN}
          clone-on-start: true
          default-label: main

#===== RabbitMQ =======
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
management:
  endpoints:
    web:
      exposure:
        include: info, health, shutdown, refresh, busrefresh, monitor

  endpoint:
    shutdown:
      enabled: true
 
    health:
      probes:
        enabled: true

  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

  info:
    env:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}

server:
  port: 8071
encrypt:
  key: suytry123