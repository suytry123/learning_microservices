version: "3.8"

services:
  configserver:
    image: suytry123/configserver:latest
    mem_limit: 700m
    ports:
      - "8000:8071"
    networks:
      - suytrynetwork

  eurekaserver:
    image: suytry123/eurekaserver:latest
    mem_limit: 700m
    ports:
      - "9000:9000"
    networks:
      - suytrynetwork
    depends_on:
      - configserver
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_CONFIG_IMPORT: configserver:http://configserver:8071/

  mongodb:
    image: mongo:7
    ports:
      - "7777:27017"
    networks:
      - suytrynetwork

  account:
    image: suytry123/account:latest
    mem_limit: 700m
    ports:
      - "7000:8080"
    networks:
      - suytrynetwork
    depends_on:
      - configserver
      - eurekaserver
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_CONFIG_IMPORT: configserver:http://configserver:8071/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:9000/eureka/

  loan:
    image: suytry123/loan:latest
    mem_limit: 700m
    ports:
      - "6000:8090"
    networks:
      - suytrynetwork
    depends_on:
      - configserver
      - eurekaserver
      - mongodb
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_CONFIG_IMPORT: configserver:http://configserver:8071/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:9000/eureka/
      MONGODB_HOST_NAME: mongodb

  card:
    image: suytry123/card:latest
    mem_limit: 700m
    ports:
      - "5000:8070"
    networks:
      - suytrynetwork
    depends_on:
      - configserver
      - eurekaserver
      - mongodb
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_CONFIG_IMPORT: configserver:http://configserver:8071/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:9000/eureka/
      MONGODB_HOST_NAME: mongodb

networks:
  suytrynetwork: