server:
  port: 9010

spring:
  application:
    name: message

  cloud:
    function:
      definition: email|sms

    stream:
      bindings:
        emailsms-in-0:
          destination: send-communication #queue name
          group: ${spring.application.name} # group message

        emailsms-out-0:
          destination: communication-send #exchange name
          group: ${spring.application.name} # group message

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    connection-timeout: 10s